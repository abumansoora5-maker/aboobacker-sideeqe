<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c33"/>
      <stop offset="55%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="rg" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <ellipse cx="320" cy="260" rx="260" ry="220" fill="url(#rg)"/>
  <circle cx="470" cy="140" r="120" fill="#3b82f6" opacity="0.12" filter="url(#blur)"/>
  <circle cx="160" cy="620" r="140" fill="#2563eb" opacity="0.1" filter="url(#blur)"/>
  <!-- subtle grid -->
  <g stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 100H640M0 200H640M0 300H640M0 400H640M0 500H640M0 600H640M0 700H640"/>
    <path d="M80 0V800M160 0V800M240 0V800M320 0V800M400 0V800M480 0V800M560 0V800"/>
  </g>
  <!-- silhouette -->
  <g fill="url(#glow)">
    <circle cx="320" cy="290" r="118" opacity="0.95"/>
    <ellipse cx="320" cy="720" rx="240" ry="210" opacity="0.9"/>
  </g>
  <!-- ring -->
  <circle cx="320" cy="290" r="132" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="320" cy="290" r="150" fill="none" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1"/>
  <!-- text -->
  <text x="320" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#93c5fd" letter-spacing="4" opacity="0.9">PROFILE PHOTO</text>
  <text x="320" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1">Replace assets/images/aboobacker-sideeqe.jpg</text>
  <!-- bottom accent -->
  <rect x="220" y="640" width="200" height="2" rx="1" fill="#3b82f6" opacity="0.45"/>
</svg>